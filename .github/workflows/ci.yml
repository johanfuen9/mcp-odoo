name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  imagen:
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen Docker
        run: docker build -t mcp-odoo:ci .
      - name: Arrancar el contenedor y revisar /health
        run: |
          docker run -d --name mcp -p 3000:3000 \
            -e TOKEN_SECRET="$(openssl rand -hex 32)" \
            -e PUBLIC_BASE_URL=https://mcp.ejemplo.com \
            mcp-odoo:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/health && exit 0
            sleep 1
          done
          docker logs mcp
          exit 1
